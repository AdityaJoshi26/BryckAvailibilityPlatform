server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Frontend static files (copy index.html here on the host).
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API so clients only need port 80.
    # The trailing slash on proxy_pass strips the /api/ prefix, e.g.
    #   /api/inventory/options/status  ->  http://127.0.0.1:8000/inventory/options/status
    # On the bare-metal/VM host the backend is local uvicorn (127.0.0.1:8000).
    # If you ever run via docker-compose instead, change this to http://backend:8000/.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
